<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플레이트</title>
<meta name="description" content="집에서 하는 헬스 커리큘럼 · 운동 코치 · 식단 · 체중 기록">
<meta name="theme-color" content="#ECEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플레이트">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling day view, fixed rest-timer sheet + tab bar at the bottom. Plate colors (IWF 25/20/15/10kg) are the only decoration. */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F5F6F7; --line:#D9DDE1;
  --fg:#15191D; --muted:#5E6872; --accent:#1F57D6; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --red:#D3232C; --yellow:#E9B200; --green:#1E8A4C; --ok:#1E8A4C; --ok-soft:#D9F0E2; --body-b:#DDE1E5; --body-m:#C4CAD1;
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Barlow Condensed","Gothic A1",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#171B20; --surface-2:#1E2329; --line:#2A3038;
  --fg:#ECEFF2; --muted:#98A2AD; --accent:#5B8BFF; --accent-ink:#0B1020; --accent-soft:#1C2A4A;
  --red:#FF5059; --yellow:#FFC933; --green:#3DCB79; --ok:#3DCB79; --ok-soft:#173527; --body-b:#262C33; --body-m:#38414B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --surface-2:#1E2329; --line:#2A3038;
  --fg:#ECEFF2; --muted:#98A2AD; --accent:#5B8BFF; --accent-ink:#0B1020; --accent-soft:#1C2A4A;
  --red:#FF5059; --yellow:#FFC933; --green:#3DCB79; --ok:#3DCB79; --ok-soft:#173527; --body-b:#262C33; --body-m:#38414B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:3px;background:var(--red);box-shadow:6px 0 0 var(--accent),12px 0 0 var(--yellow)}
.brand span{margin-left:12px}
.week{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px}.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots b.on{background:var(--ok)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.chip[aria-pressed="true"] small{color:var(--yellow)}
.hero{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px}
.meta div{display:flex;flex-direction:column}
.meta .num{font-size:26px;font-weight:600;line-height:1}
.meta .num small{font-size:15px;color:var(--muted);margin-left:2px}
.tip{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ex{display:grid;grid-template-columns:72px 1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex h3{margin:0;font-size:16px;font-weight:700;min-width:0;grid-column:2}
.ex .thumb{grid-row:1/3;grid-column:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.ex .spec{grid-column:2;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.ex .spec .num{font-size:18px;color:var(--fg);font-weight:600}
.ex .side{grid-row:1/3;grid-column:3;display:flex;align-items:center}
.btn-ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500}
.plates{display:flex;gap:3px;align-items:center}
.plate{display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:11px;color:#fff;border-radius:3px;padding:0 3px;min-width:16px}
.p25{background:#D3232C;height:24px}.p20{background:#1F57D6;height:22px}.p15{background:#E9B200;height:20px;color:#1a1a1a}.p10{background:#1E8A4C;height:18px}.p5{background:#F2F2F2;height:15px;color:#1a1a1a;border:1px solid #bbb}.p2{background:#6B7280;height:13px}.p1{background:#A0A7B0;height:11px;color:#1a1a1a}
.bar{font-size:11px;color:var(--muted);margin-right:2px}
/* exercise photos: start + end frames cross-fade to show the movement */
.thumb{position:relative;width:72px;height:54px;border:0;padding:0;border-radius:10px;background:var(--surface-2);align-self:center;overflow:hidden;flex:none}
.thumb img,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb img.b{animation:xf 2.8s ease-in-out infinite}
@keyframes xf{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.namebtn{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:16px}
.namebtn::after{content:" ›";color:var(--muted);font-weight:500}
.wex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.wex-top .thumb{width:56px;height:42px}
.wex-top .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.wex-top .num{color:var(--muted);font-size:15px}
.prev{font-size:12px;color:var(--muted);margin:-2px 0 8px}
.prev b{color:var(--fg);font-weight:600}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,10,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.stage{position:relative;aspect-ratio:4/3;width:100%;background:#fff;border-radius:14px;overflow:hidden;flex:none;border:0;padding:0}
.stage img{object-fit:contain;transition:opacity .45s ease}
.stage .phase{position:absolute;left:10px;top:10px;font-size:12px;font-weight:800;color:#fff;background:rgba(15,18,22,.72);padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.stage .hint{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(15,18,22,.6);padding:3px 8px;border-radius:999px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.cues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.cues li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.cues li b{font-family:var(--num);font-size:17px;color:var(--accent)}
.warn{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.warn b{color:var(--red)}
.video{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player{display:block;text-decoration:none}.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.player .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;font-size:16px}.player .play svg{width:28px;height:28px}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:13px;font-weight:800;font-size:15px}
.yt svg{width:20px;height:20px}
.paste{display:flex;gap:6px}
.paste input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.paste button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 14px;font-weight:800}
.sheet-row{display:flex;gap:8px}
.sheet-row button{flex:1}
.cardio{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.cardio .thumb{width:56px;height:42px}
.cardio p{margin:0;font-size:14px;min-width:0}
.cardio strong{display:block;font-size:15px}
.cta{width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;padding:16px;letter-spacing:.02em}
.cta.alt{background:var(--fg);color:var(--bg)}
/* active workout */
.run-head{display:flex;justify-content:space-between;align-items:center;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:12px 16px}
.run-head .num{font-size:30px;font-weight:600;line-height:1}
.run-head button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:800}
.wex{background:var(--surface);border-radius:var(--r);padding:14px 14px 10px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px 8px;align-items:center}
.sets .hd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.sets .no{font-family:var(--num);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:8px 6px;text-align:center;font-family:var(--num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sets .row-done input{background:var(--ok-soft);border-color:transparent}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:800;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.addset{margin-top:8px;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
.check-cardio{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 16px}
.check-cardio .chk{width:48px;flex:none}
/* summary */
.done-card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--ok)}
.done-card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.prs{display:flex;flex-direction:column;gap:4px;font-size:14px}
.prs b{color:var(--ok)}
/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px}
.stat .num{font-size:28px;font-weight:600;line-height:1.1;display:block}
.stat .num small{font-size:14px;color:var(--muted)}
.chart{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.chart svg{display:block;width:100%;height:auto}
.wt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.wt-head .num{font-size:30px;font-weight:600;line-height:1}
.wt-head .num small{font-size:15px;color:var(--muted)}
.delta{font-family:var(--num);font-size:17px;font-weight:600}
.delta.down{color:var(--ok)}.delta.up{color:var(--red)}
.wt-in{display:flex;gap:6px;margin-top:10px}
.wt-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:9px 10px;font-family:var(--num);font-size:20px;font-weight:600}
.wt-in button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 16px;font-weight:800}
.hist{background:var(--surface);border-radius:var(--r)}
.hist details{border-top:1px solid var(--line)}
.hist details:first-child{border-top:0}
.hist summary{list-style:none;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hdate{text-align:center;line-height:1}
.hdate .num{font-size:24px;font-weight:700;display:block}
.hdate small{font-size:11px;color:var(--muted)}
.hname{font-weight:700;min-width:0}
.hname small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.hvol{text-align:right}.hvol .num{font-size:20px;font-weight:600}
.hdetail{padding:0 16px 14px 80px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hdetail b{color:var(--fg);font-weight:500}
.del{align-self:flex-start;margin-top:6px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--red)}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
/* settings */
.set-group{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.set-group h3{margin:0;font-size:15px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{font-size:13px;color:var(--muted);margin:0}
.row2{display:flex;gap:8px}
.row2 button{flex:1;padding:11px 8px;font-weight:700}
.install{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.install button{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:800}
/* diet */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px;font-size:18px;font-weight:700}
.daynav button:disabled{opacity:.35}
.daynav strong{font-size:16px}
.kcal-card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.kcal-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kcal-top .num{font-size:40px;font-weight:700;line-height:1}
.kcal-top .num small{font-size:16px;color:var(--muted);margin-left:2px}
.kcal-top .over{color:var(--red)}
.kcal-top .side{text-align:right;font-size:13px;color:var(--muted)}
.kcal-top .side b{font-family:var(--num);font-size:18px;color:var(--fg)}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.over i{background:var(--red)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.macro .num{font-size:17px;color:var(--fg)}
.macro .num small{font-size:12px;color:var(--muted);font-weight:500}
.macro .meter{height:6px}
.macro.p .meter i{background:var(--red)}.macro.c .meter i{background:var(--yellow)}.macro.f .meter i{background:var(--green)}
.meal{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-h h3{margin:0;font-size:16px}
.meal-h .num{font-size:17px;color:var(--muted)}
.food{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.food .fn{min-width:0}
.food .fn small{display:block;color:var(--muted);font-size:12px}
.food .fk{font-family:var(--num);font-size:17px;font-weight:600;text-align:right;min-width:44px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:30px;height:30px;font-size:16px;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-family:var(--num);font-size:16px;font-weight:600}
.add-food{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px;font-weight:700;color:var(--accent);font-size:14px}
.rec{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rec .label{color:var(--accent)}
.rec .row2 button{padding:8px;font-size:13px}
.rec .row2 .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:800}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:34px;height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px 8px 12px 12px;font-size:0;position:relative;overflow:hidden}
.water button.on{background:var(--accent-soft);border-color:var(--accent)}
.water button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--accent);opacity:.55}
.setup{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--accent)}
.setup h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fields input,.cust input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:9px 10px;font-family:var(--num);font-size:19px;font-weight:600}

}
async function initCloud(){
  const c=window.claude; if(!c||!c.use) return;
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    profileRef=db.doc("data/users/"+uid+"/profile");
    workoutsCol=profileRef.collection("workouts");
    daysCol=profileRef.collection("days");
    S.cloud=true;
    daysCol.orderBy("d","desc").limit(120).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{m[d.id]=d.data()});
      Object.keys(S.days).forEach(k=>{if(!m[k]&&S.days[k].items.length)daysCol.doc(k).set(S.days[k]).catch(()=>{})});
      S.days={...S.days,...m}; ls.set("pt.days",S.days); if(S.tab==="diet")render();
    },()=>{});
    profileRef.onSnapshot(s=>{
      if(s.exists){const d={...s.data()};
        // an older copy without the first-run answers must not undo them
        if(S.profile.onboarded&&!d.onboarded){OB_KEYS.forEach(k=>{d[k]=S.profile[k]});d.diet={...(d.diet||{}),...S.profile.diet};store.saveProfile()}
        S.profile={...DEFAULT_PROFILE,...d,videos:d.videos||{},swaps:d.swaps||{},diet:{...DEFAULT_PROFILE.diet,...(d.diet||{})}};delete S.profile.weights;
        if(Array.isArray(d.weights))S.weights=cleanWeights(d.weights);ls.set("pt.profile",S.profile);ls.set("pt.weights",S.weights);applyTheme()}
      else if(!s.metadata.fromCache){profileRef&&profileRef.set({...S.profile,weights:S.weights}).catch(()=>{})}
      bgRender();
    },()=>{});
    workoutsCol.orderBy("date","desc").limit(300).onSnapshot(snap=>{
      S.history=snap.docs.map(d=>({...d.data(),id:d.id}));
      ls.set("pt.history",S.history); bgRender();
    },()=>{});
    bgRender();
  }catch(e){}
}

function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=="plate"||!Array.isArray(d.history)) throw 0;
      const ids=new Set(S.history.map(w=>w.id));
      const add=d.history.filter(w=>w&&w.id&&!ids.has(w.id));
      S.history=[...S.history,...add].sort((a,b)=>b.date.localeCompare(a.date));
      const wm=new Map(S.weights.map(w=>[w.d,w]));(d.weights||[]).forEach(w=>{if(w&&w.d&&!wm.has(w.d))wm.set(w.d,w)});
      S.weights=[...wm.values()].sort((a,b)=>a.d.localeCompare(b.d));
      Object.entries(d.days||{}).forEach(([k,v])=>{if(v&&Array.isArray(v.items)&&!S.days[k]){S.days[k]=v;store.saveDay(k)}});
      if(d.profile) S.profile={...DEFAULT_PROFILE,...d.profile,videos:{...(d.profile.videos||{}),...S.profile.videos}};
      ls.set("pt.history",S.history);ls.set("pt.weights",S.weights);store.saveProfile();applyTheme();render();
      if(workoutsCol)add.forEach(w=>workoutsCol.doc(w.id).set(w).catch(()=>{}));
      toast(`운동 ${add.length}개를 불러왔어요`);
    }catch(e){toast("플레이트 백업 파일이 아니에요")}
  };
  r.readAsText(file);
}

/* ---------- training logic ---------- */
const split = () => SPLITS[S.profile.days]||SPLITS[3];
function recommendedDay(){
  const n=split().length;
  const last=S.history.find(w=>w.days===S.profile.days);
  return last?(last.dayIdx+1)%n:0;
}
function exFor(dayIdx,slot){
  const key=S.profile.days+"-"+dayIdx+"-"+slot;
  const sw=S.profile.swaps[key];
  return sw&&EX[sw]?sw:split()[dayIdx].x[slot];
}
function lastPerf(id,skipId,noDeload){
  for(const w of S.history){if(w.id===skipId||(noDeload&&w.deload))continue;const e=w.exercises.find(e=>e.id===id); if(e&&e.sets.some(s=>s.done)) return e}
  return null;
}
function bestKg(id,skipId){let b=0;for(const w of S.history){if(w.id===skipId)continue;for(const e of w.exercises)if(e.id===id)for(const s of e.sets)if(s.done&&+s.kg>b)b=+s.kg}return b}
function incOf(t){return t==="db"?2:t==="bw"?0:2.5}
function plan(dayIdx){
  const p=S.profile, lv=p.level, d=split()[dayIdx], ph=progInfo(), sm=p.sessionMin;
  const items=d.x.map((_,slot)=>{
    const id=exFor(dayIdx,slot), e=EX[id], sc=e.c?ph.cmp:ph.acc;
    const sets=Math.max(2,Math.min(5,sc[0]+(sm>=50&&e.c?1:0)+(sm>=60&&!e.c?1:0)-(sm<=30?1:0)-(ph.deload?1:0)));
    let lo=sc[1], hi=sc[2];
    if(e.t==="bw"&&!e.u){lo+=3;hi+=5}
    if(e.u==="초"){lo=hi=Math.round(e.reps*[1,1,1.2,1.33][ph.stage]/5)*5}
    const rest=Math.max(30,(e.c?60:45)+ph.restAdj+p.restAdj+((p.diet.age||0)>=50?15:0));
    let {kg,reps,why}=nextLoad(id,e,lo,hi,lv);
    if(ph.deload&&e.t!=="bw"&&e.u!=="초"){kg=roundKg(kg*.9,e.t);why=ph.comeback?"복귀 주간 · 가볍게":"회복 주간 · 90%"}
    return {id,slot,sets,reps,lo,hi,rest,kg,why};
  });
  const strengthOf=()=>Math.round(items.reduce((a,b)=>a+b.sets*(45+b.rest),0)/60);
  // keep the session inside its length: take sets off the small exercises first
  for(let g=0;g<30&&5+strengthOf()+5+2>sm;g++){const c=items.filter(it=>it.sets>2).sort((a,b)=>(EX[a.id].c?1:0)-(EX[b.id].c?1:0)||b.sets-a.sets)[0];if(!c)break;c.sets--}
  const strength=strengthOf(), totalSets=items.reduce((a,b)=>a+b.sets,0);
  const cardioMin=Math.max(5,Math.min(ph.goal==="muscle"?8:ph.goal==="fit"?12:15,sm-7-strength));
  let cardio={...CARDIO[dayIdx%CARDIO.length]};
  // running is hard on the knees at a high body weight, in the first stage and in easy weeks: walk uphill instead
  if(cardio.kind==="int"&&(bmiNow()>=30||ph.stage===0||ph.deload)) cardio={...CARDIO[0],why:bmiNow()>=30?"체중이 줄 때까지는 무릎에 부담이 적은 경사 걷기로 해요.":"이번 주는 달리기 대신 경사 걷기로 해요."};
  const mins=5+strength+cardioMin+2;
  return {...d,items,totalSets,mins,strength,cardioMin,ph,cardio:{...cardio,min:cardioMin}};
}
function platesFor(kg){
  let side=(kg-20)/2; if(side<=0) return null;
  const out=[];
  for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-6){out.push(p);side-=p}}
  return out;
}
const pCls=p=>p===2.5?"p2":p===1.25?"p1":"p"+p;
function platesHTML(kg){
  const ps=platesFor(kg); if(!ps) return "";
  return `<span class="plates" title="한쪽 원판"><span class="bar">봉 20 + 한쪽</span>${ps.map(p=>`<span class="plate ${pCls(p)}">${p}</span>`).join("")}</span>`;
}

  ${a.coach?`<button type="button" class="cta" id="cCoach">코치 모드로 돌아가기</button>`:""}

        <input id="rp-${ei}-${si}" inputmode="numeric" aria-label="${si+1}세트 ${e.u||"반복"}" value="${s.reps}" data-f="reps" data-e="${ei}" data-s="${si}">
        <button type="button" class="chk" data-chk="${ei}-${si}" aria-pressed="${!!s.done}" aria-label="${si+1}세트 완료">✓</button>

function viewDone(){
  const w=S.finished, ph=progInfo(), kcal=workoutKcal(w);
  const prs=w.exercises.map(x=>{const e=EX[x.id];if(!e||e.t==="bw")return null;const ds=x.sets.filter(s=>s.done);if(!ds.length)return null;
    const top=Math.max(...ds.map(s=>+s.kg||0)), prev=bestKg(x.id,w.id);
    if(top>prev&&prev>0) return `${esc(e.n)} · <b class="num" style="font-size:17px">${prev} → ${top}kg</b>`;
    const e1=Math.max(...ds.map(s=>e1rm(+s.kg||0,+s.reps||0))), pe=bestE1(x.id,w.id);
    return e1>pe+.5&&pe>0?`${esc(e.n)} · 추정 1RM <b class="num" style="font-size:17px">${Math.round(pe)} → ${Math.round(e1)}kg</b>`:null}).filter(Boolean);
  const nexts=w.exercises.map(x=>{const e=EX[x.id];if(!e||e.u==="초")return null;const ds=x.sets.filter(s=>s.done);if(!ds.length)return null;
    const hi=x.hi||x.target, all=ds.length>=x.sets.length&&Math.min(...ds.map(s=>+s.reps||0))>=hi;
    return `<span>${esc(e.n)} · ${all?`<b style="color:var(--ok)">${e.t==="bw"?"다음엔 +1회":`다음엔 +${incOf(e.t)}kg`}</b>`:"다음에도 같은 무게로 횟수 채우기"}</span>`}).filter(Boolean);
  return `<div class="stack"><section class="done-card">
    <div class="label">${new Date(w.date).getMonth()+1}월 ${new Date(w.date).getDate()}일 · ${esc(w.name)}${w.phase?" · "+esc(w.phase):""}</div>
    <h2>오늘 운동 끝!</h2>
    <div class="meta">
      <div><span class="label">운동 시간</span><span class="num">${Math.round(w.duration/60)}<small>분</small></span></div>
      <div><span class="label">완료 세트</span><span class="num">${w.setsDone}</span></div>
      <div><span class="label">총 볼륨</span><span class="num">${w.volume.toLocaleString()}<small>kg</small></span></div>
      <div><span class="label">소모</span><span class="num">${kcal}<small>kcal</small></span></div>
    </div>
    <p class="tip">체지방 약 <b style="color:var(--fg)">${Math.round(kcal/7.7)}g</b>을 태운 만큼이에요. ${w.cardioDone?"유산소까지 마쳤어요.":"다음엔 마무리 유산소도 해보세요."}</p>
    ${prs.length?`<div class="prs"><span class="label">기록 경신</span>${prs.map(x=>`<span>${x}</span>`).join("")}</div>`:""}
    ${nexts.length?`<div class="done-next"><span class="label">다음 운동에서는</span>${nexts.join("")}</div>`:""}
    <p class="tip">${ph.label} ${ph.inS}/${ph.len}주 · 이번 주 ${thisWeek()}/${S.profile.days}회 달성</p>
  </section><button type="button" class="cta" id="back">다음 루틴 보기</button></div>`;
}

function weightCard(){
  const ws=S.weights, last=ws[ws.length-1], first=ws[0], dt=S.profile.diet, h=(dt.height||171)/100;
  const todayW=ws.find(w=>w.d===today())||{}, todayKg=todayW.kg;
  const wsts=ws.filter(w=>w.waist), lastWs=wsts[wsts.length-1], firstWs=wsts[0];
  const goal=S.profile.goalKg, cut=dt.sex==="f"?85:90;
  let top="", chart="";
  if(last){
    const bmi=last.kg/(h*h), [cat,col]=bmiCat(bmi), diff=+(last.kg-first.kg).toFixed(1), rate=weightTrend(ws);
    const left=goal?+(last.kg-goal).toFixed(1):null, tot=goal?first.kg-goal:0;
    const pct=goal?(tot>0?Math.max(0,Math.min(100,(first.kg-last.kg)/tot*100)):(left<=0?100:0)):0;
    const eta=rate!=null&&rate<-.05&&left>0?Math.ceil(left/-rate):null;
    top=`<div class="wt-head"><div><div class="label">체중</div><span class="num">${last.kg}<small>kg</small></span></div>
      ${ws.length>=2?`<span class="delta ${diff<0?"down":diff>0?"up":""}">${diff>0?"+":""}${diff}kg <span class="label">시작 대비</span></span>`:""}</div>
    <div class="wt-stats">
      <div><span class="label">BMI</span><span class="num">${bmi.toFixed(1)}</span><small style="color:${col}">${cat}</small></div>
      <div><span class="label">주간 변화</span><span class="num">${rate==null?"–":(rate>0?"+":"")+rate.toFixed(2)}<small>kg</small></span><small>${rate==null?"1~2주 더 기록하면 계산":"최근 3주 추세"}</small></div>
      <div><span class="label">허리</span><span class="num">${lastWs?lastWs.waist:"–"}<small>cm</small></span><small>${lastWs&&wsts.length>=2?`시작 대비 ${lastWs.waist-firstWs.waist>0?"+":""}${+(lastWs.waist-firstWs.waist).toFixed(1)}cm`:`${cut}cm 미만이 목표`}</small></div>
    </div>
    ${goal?`<div class="goalbar"><div class="an-h"><span class="label">목표 ${goal}kg</span><span class="note">${left>0?`${left}kg 남음${eta?` · 지금 속도면 약 ${eta}주`:""}`:"목표 달성! 설정에서 다음 목표를 정해 보세요"}</span></div><div class="meter"><i style="width:${pct}%;background:var(--ok)"></i></div></div>`:`<p class="note" style="margin-bottom:10px">설정에서 목표 체중을 정하면 남은 kg과 도달 시기를 알려 드려요.</p>`}
    ${rate!=null&&rate<-last.kg*.01?`<div class="warn"><b>조금 빨라요</b> · 주 ${(-rate).toFixed(1)}kg은 체중의 1%가 넘어요. 근육도 같이 빠질 수 있으니 하루 100~200kcal 더 드세요.</div>`:""}`;
  }
  if(ws.length>=2){
    const endT=dT(last.d); let pts=wtRange?ws.filter(w=>endT-dT(w.d)<=wtRange*864e5):ws; if(pts.length<2) pts=ws.slice(-2);
    const t0=dT(pts[0].d), span=Math.max(864e5,endT-t0);
    const avg=pts.map(p=>{const t=dT(p.d), win=ws.filter(q=>{const u=dT(q.d);return u<=t&&u>t-7*864e5});return win.reduce((a,q)=>a+q.kg,0)/win.length});
    let lo=Math.min(...pts.map(p=>p.kg)), hi=Math.max(...pts.map(p=>p.kg));
    const showGoal=goal&&goal>=lo-4&&goal<=hi+1; if(showGoal){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
    lo-=.3; hi+=.3;
    const W=320,H=130, x=t=>10+(t-t0)/span*(W-20), y=v=>10+(hi-v)/(hi-lo)*(H-34);
    chart=`<div class="seg" role="group" aria-label="기간">${[[30,"30일"],[90,"90일"],[0,"전체"]].map(([v,l])=>`<button type="button" data-wr="${v}" aria-pressed="${wtRange===v}">${l}</button>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 변화">
      ${showGoal?`<line x1="10" x2="${W-10}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-10}" y="${y(goal)-5}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok)" font-family="Gothic A1,sans-serif">목표 ${goal}</text>`:""}
      ${pts.map(p=>`<circle cx="${x(dT(p.d)).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="2.5" fill="var(--accent)" opacity=".35"/>`).join("")}
      <path d="${pts.map((p,i)=>(i?"L":"M")+x(dT(p.d)).toFixed(1)+" "+y(avg[i]).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(endT)}" cy="${y(avg[avg.length-1])}" r="4" fill="var(--accent)"/>
      <text x="10" y="${H-6}" font-size="11" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${pts[0].d.slice(5).replace("-","/")}</text>
      <text x="${W-10}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${last.d.slice(5).replace("-","/")}</text>
    </svg>
    <div class="legend"><span><i style="background:var(--accent);opacity:.35"></i>매일 체중</span><span><i style="background:var(--accent)"></i>7일 평균</span></div>`;
  }
  return `<div class="chart">
    ${top||`<div class="wt-head"><div><div class="label">체중</div><span class="note">아직 기록이 없어요</span></div></div>`}
    ${chart}
    <div class="wt-in"><input id="wtIn" inputmode="decimal" placeholder="체중 kg" value="${todayKg??""}" aria-label="오늘 체중"><input id="wsIn" inputmode="decimal" placeholder="허리 cm (선택)" value="${todayW.waist??""}" aria-label="오늘 허리둘레"><button type="button" id="wtSave">${todayKg!=null?"수정":"기록"}</button></div>
    <p class="note" style="margin-top:8px">아침 공복, 화장실 다녀온 뒤에 재요. 하루하루 오르내리는 건 정상이라 7일 평균 선을 보세요.</p>
  </div>`;
}

/* ---------- actions ---------- */
function startWorkout(){
  const p=plan(S.day), ph=p.ph;
  S.active={start:Date.now(),dayIdx:S.day,days:S.profile.days,name:p.n,cardio:p.cardio,cardioDone:false,phase:{label:ph.label,inS:ph.inS,deload:ph.deload,comeback:ph.comeback},coach:{key:"warm0",start:Date.now(),cue:{}},
    exercises:p.items.map(it=>({id:it.id,target:it.reps,lo:it.lo,hi:it.hi,rest:it.rest,sets:Array.from({length:it.sets},()=>({kg:EX[it.id].t==="bw"?0:it.kg,reps:it.reps,done:false}))}))};
  S.view="coach"; ensureAudio(); sfx("go");
  wake(); scrollTo(0,0); tickElapsed(); startCoachTimer();
  coachGo(0);
}
function saveDraft(){ls.set("pt.active",S.active)}
function finishWorkout(){
  const a=S.active; if(!a) return;
  const setsDone=a.exercises.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);
  if(!setsDone){toast("완료한 세트가 없어요. ✓를 눌러 세트를 기록하세요");return}
  const volume=Math.round(a.exercises.reduce((v,x)=>{const m=EX[x.id].t==="db"&&!EX[x.id].one?2:1;return v+x.sets.filter(s=>s.done&&EX[x.id].u!=="초").reduce((t,s)=>t+(+s.kg||0)*(+s.reps||0)*m,0)},0));
  const dur=Math.round((Date.now()-a.start)/1000);
  const mm=(a.coach?WARM_MM+COOL_MM:0)+setsMM(a.exercises.filter(x=>EX[x.id]).map(x=>[EX[x.id],x.sets.filter(s=>s.done).length,x.rest]))+(a.cardioDone&&a.cardio?(a.cardio.min||10)*cardioMet(a.cardio):0);
  const kcal=Math.round(mm*bodyKg()/60);
  const w={id:"w"+Date.now(),date:new Date(a.start).toISOString(),dayIdx:a.dayIdx,days:a.days,name:a.name,duration:dur,setsDone,volume,kcal,cardioDone:a.cardioDone,
    phase:a.phase?a.phase.label:null,deload:!!(a.phase&&a.phase.deload),
    exercises:a.exercises.map(x=>({id:x.id,target:x.target,lo:x.lo||x.target,hi:x.hi||x.target,sets:x.sets.map(s=>({kg:+s.kg||0,reps:+s.reps||0,done:!!s.done}))}))};
  S.active=null; saveDraft(); stopRest(); music.stop(); clearInterval(coachIv); store.addWorkout(w); S.finished=w; S.day=null;
  try{wl&&wl.release()}catch(e){}
  render(); scrollTo(0,0);
}

/* rest timer */
let rest=null, restIv=null, actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.18);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec,label){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  rest={end:Date.now()+sec*1000,total:sec,label,rang:false};
  $("timer").hidden=false; clearInterval(restIv); restIv=setInterval(tickRest,250); tickRest();
}
function tickRest(){
  if(!rest) return;
  const left=(rest.end-Date.now())/1000;
  $("tclock").textContent=left>0?fmtT(Math.ceil(left)):"GO";
  $("timer").classList.toggle("over",left<=0);
  $("tlbl").textContent=left>0?rest.label:"다음 세트 시작!";
  $("tbar").style.width=Math.max(0,Math.min(100,left/rest.total*100))+"%";
  if(left<=0&&!rest.rang){rest.rang=true;beep();setTimeout(()=>{if(rest&&rest.end<=Date.now())stopRest()},4000)}
}
function stopRest(){rest=null;clearInterval(restIv);$("timer").hidden=true}

let elIv=null;
function tickElapsed(){clearInterval(elIv);elIv=setInterval(()=>{const el=$("elapsed");if(el&&S.active)el.textContent=fmtT((Date.now()-S.active.start)/1000)},1000)}
let wl=null; async function wake(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(S.active)wake();tickRest()}});

let tt=null; function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function applyTheme(){const t=S.profile.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}

function saveWeight(){
  const v=parseFloat(($("wtIn").value||"").replace(",","."));
  if(!(v>20&&v<400)){toast("체중을 kg 단위 숫자로 적어 주세요");return}
  const d=today(), kg=Math.round(v*10)/10, i=S.weights.findIndex(w=>w.d===d);
  const wv=parseFloat(($("wsIn").value||"").replace(",",".")), waist=wv>40&&wv<200?Math.round(wv*10)/10:null;
  if(i>=0){S.weights[i].kg=kg;if(waist)S.weights[i].waist=waist} else S.weights.push(waist?{d,kg,waist}:{d,kg});
  S.weights.sort((a,b)=>a.d.localeCompare(b.d)); store.saveWeights(); render(); toast("체중을 기록했어요");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(obClick(b)) return;
  if(progClick(b)) return;
  if(d.info){openInfo(d.info);return}
  if(b.id==="closeInfo"){closeInfo();return}
  if(coachClick(b)) return;
  if(b.id==="stage"){stagePaused=!stagePaused;return}
  if(b.id==="vidSave"){saveVideo(b.dataset.ex);return}
  if(b.id==="vidDel"){delete S.profile.videos[b.dataset.ex];store.saveProfile();openInfo(b.dataset.ex);toast("영상을 지웠어요");return}
  if(d.tab){if(S.active&&S.active.coach&&d.tab!=="today")music.stop();else if(S.active&&S.active.coach&&!S.active.coach.paused)music.set(musicFor(curStep(S.active).st.k));S.tab=d.tab;S.confirmDel=null;if(d.tab==="today"&&!S.active)S.finished=null;render();scrollTo(0,0);return}
  if(d.day!=null){S.day=+d.day;render();return}
  if(d.swap!=null){
    const slot=+d.swap,cur=exFor(S.day,slot),m=EX[cur].m;
    const used=split()[S.day].x.map((_,i)=>exFor(S.day,i));
    const pool=Object.keys(EX).filter(k=>EX[k].m===m&&(k===cur||!used.includes(k)));
    const next=pool[(pool.indexOf(cur)+1)%pool.length];
    const key=S.profile.days+"-"+S.day+"-"+slot;
    if(next===split()[S.day].x[slot]) delete S.profile.swaps[key]; else S.profile.swaps[key]=next;
    store.saveProfile(); render(); toast(EX[next].n+"(으)로 교체했어요"); return}
  if(b.id==="start"){startWorkout();return}
  if(b.id==="finish"||b.id==="finish2"){finishWorkout();return}
  if(b.id==="back"){S.finished=null;render();return}
  if(b.id==="discard"){if(S.confirmDel==="active"){S.active=null;S.confirmDel=null;saveDraft();stopRest();music.stop();clearInterval(coachIv);try{speechSynthesis.cancel()}catch(e){}render()}else{S.confirmDel="active";render()}return}
  if(b.id==="cardio"){S.active.cardioDone=!S.active.cardioDone;saveDraft();render();return}
  if(d.chk){
    const [ei,si]=d.chk.split("-").map(Number),x=S.active.exercises[ei],s=x.sets[si];
    s.done=!s.done;
    if(s.done){
      const last=si===x.sets.length-1, nextEx=S.active.exercises[ei+1];
      // carry an edited weight forward to the untouched sets below
      for(let k=si+1;k<x.sets.length;k++){if(!x.sets[k].done&&+s.kg>0)x.sets[k].kg=s.kg}
      startRest(x.rest,last?(nextEx?"다음: "+EX[nextEx.id].n:"마지막 운동 끝 · 유산소로"):"휴식 · "+(si+2)+"세트 준비");
    }
    saveDraft(); render(); return}
  if(d.add!=null){const x=S.active.exercises[+d.add],l=x.sets[x.sets.length-1];x.sets.push({kg:l.kg,reps:l.reps,done:false});saveDraft();render();return}
  if(d.del){if(S.confirmDel===d.del){S.confirmDel=null;store.delWorkout(d.del)}else{S.confirmDel=d.del;render()}return}
  if(d.dset){S.profile.diet[d.dset]=d.dset==="sex"?d.v:+d.v;store.saveProfile();render();return}
  if(d.set){S.profile[d.set]=["theme","goal"].includes(d.set)?d.v:+d.v;if(d.set==="days")S.day=null;if(d.set==="theme")applyTheme();store.saveProfile();render();return}
  if(b.id==="resetSwaps"){S.profile.swaps={};store.saveProfile();render();return}
  if(b.id==="wtSave"){saveWeight();return}
  if(dietClick(b)) return;
  if(analysisClick(b)) return;
  if(b.id==="exportBtn"){exportData();return}
  if(b.id==="importBtn"){$("importFile").click();return}
  if(b.id==="tplus"&&rest){rest.end+=15000;rest.total+=15;rest.rang=false;tickRest();return}
  if(b.id==="tminus"&&rest){rest.end-=15000;tickRest();return}
  if(b.id==="tskip"){stopRest();return}
});
document.addEventListener("input",e=>{

const LUNCH_KCAL = 650;
// lunch is the company meal (about 650kcal with 2/3 bowl of rice); the rest of the day is split around it
const SHARE = {b:.38,d:.47,s:.15};
// a meal not logged yet gets its share of what is left today, so a big lunch makes dinner smaller
function mealBudget(m,t,day){
  if(!t) return null;
  if(m==="l") return LUNCH_KCAL;
  const base=Math.round(Math.max(600,t.kcal-LUNCH_KCAL)*SHARE[m]/10)*10;
  if(!day||!day.items.length) return base;
  const logged=new Set(day.items.map(i=>i.m)); if(logged.has(m)) return base;
  const open=["b","d","s"].filter(x=>!logged.has(x));
  const left=t.kcal-sums(day.items).k-(logged.has("l")?0:LUNCH_KCAL);
  return Math.max(m==="s"?0:250,Math.round(left*SHARE[m]/open.reduce((a,x)=>a+SHARE[x],0)/10)*10);
}

const PACE = [[300,"천천히 (주 0.3kg)"],[500,"보통 (주 0.5kg)"],[700,"빠르게 (주 0.7kg)"]];
function targetsFor(dt,kg,goal,days){
  if(!dt||!dt.sex||!dt.age||!kg) return null;
  const ht=dt.height||171, bmr=10*kg+6.25*ht-5*dt.age+(dt.sex==="f"?-161:5);
  const tdee=bmr*([1.2,1.375,1.55][dt.act||0]+(days||3)*0.03);
  const h=ht/100, bmi=kg/(h*h), g=goal||"lose";
  let kcal=g==="lose"?tdee-PACE[dt.pace??1][0]:g==="muscle"?(bmi<23?tdee+250:bmi<27?tdee:tdee-300):(bmi<25?tdee:tdee-300);
  kcal=Math.max(Math.round(kcal/10)*10,Math.round(bmr/10)*10,dt.sex==="f"?1300:1600);
  const refKg=bmi>30?25*h*h:kg, p=Math.round(refKg*(g==="muscle"?2:g==="fit"?1.6:1.8)), f=Math.round(kcal*.27/9), c=Math.max(80,Math.round((kcal-p*4-f*9)/4));
  return {kcal,p,c,f,bmr:Math.round(bmr),tdee:Math.round(tdee),weekly:+((tdee-kcal)*7/7700).toFixed(2)};
}
function targets(){return targetsFor(S.profile.diet,curWeight(),S.profile.goal,S.profile.days)}
function sums(items){return items.reduce((a,i)=>({k:a.k+i.k*i.s,p:a.p+i.p*i.s,c:a.c+i.c*i.s,f:a.f+i.f*i.s}),{k:0,p:0,c:0,f:0})}
function itemFrom(food,meal,s){return {id:food.id,n:food.n,u:food.u,k:food.k,p:food.p,c:food.c,f:food.f,s,m:meal}}
function addItems(key,list){const day=dayOf(key);day.items=[...day.items,...list];S.days[key]=day;store.saveDay(key);rememberRecent(list.map(i=>i.id).filter(Boolean))}
function rememberRecent(ids){const r=ls.get("pt.recentFoods",[]);ls.set("pt.recentFoods",[...new Set([...ids,...r])].slice(0,16))}
function planFor(meal,key,budget){
  const list=PLANS[meal], n=Math.round(new Date(key).getTime()/864e5)+(S.planShift[meal]||0);
  const tpl=list[((n%list.length)+list.length)%list.length];
  const base=tpl.reduce((a,[id,s])=>a+FOOD[id].k*s,0);
  const fac=budget?Math.min(1.8,Math.max(.6,budget/base)):1;
  return tpl.map(([id,s])=>{const fd=FOOD[id];const sc=FIXED_CATS.includes(fd.cat)?s:/^1(개|장|팩|스쿱)/.test(fd.u)&&s>=1?Math.max(1,Math.round(s*fac)):Math.max(.5,Math.round(s*fac*2)/2);return itemFrom(fd,meal,sc)});
}
const fmtS = s => (s%1?s.toFixed(1):String(s));
// "1공기 210g" × 0.5 → "반 공기", "100g" × 1.5 → "150g", "1개" × 2 → "2개"
function portion(u,s){
  const m=String(u||"").split(" ")[0].match(/^(\d+(?:\/\d+)?|\d*\.\d+)(\D+)$/);
  if(!m) return fmtS(s)+"인분";
  const [a,b]=m[1].split("/"), q=Math.round((b?a/b:+a)*s*100)/100, w=m[2];
  if(/^(g|ml)$/.test(w)) return Math.round(q)+w;
  return (q===.5?"반 ":fmtS(q))+w;
}

/* ---------- coach mode: the whole session as timed steps, with voice, sound effects and music ---------- */
const WARM = [
  {sec:240,t:"런닝머신 빠르게 걷기",d:"시속 5.5km · 경사 3%",say:"런닝머신 빠르게 걷기 4분이에요. 시속 5.5, 경사 3으로 맞추세요."},
  {sec:60,t:"맨몸 워밍업",d:"맨몸 스쿼트 10회 · 팔 돌리기 · 엉덩이 접었다 펴기",say:"런닝머신에서 내려와서 맨몸 스쿼트 10회, 팔 돌리기를 해주세요."}
];
const COOL = [
  {sec:30,t:"허벅지 앞 스트레칭",d:"벽 잡고 발목 잡아 당기기 · 한쪽 15초씩",say:"허벅지 앞 스트레칭. 한쪽씩 15초."},
  {sec:30,t:"햄스트링 스트레칭",d:"다리 펴고 상체를 천천히 숙이기",say:"햄스트링 스트레칭. 무릎 펴고 천천히 숙이세요."},
  {sec:30,t:"가슴·어깨 스트레칭",d:"벽에 팔 대고 가슴 열기 · 한쪽 15초씩",say:"가슴과 어깨 스트레칭."},
  {sec:30,t:"고양이·소 자세",d:"네 발로 엎드려 등 말았다 펴기 · 천천히 호흡",say:"마지막, 고양이 소 자세로 허리를 풀어요. 깊게 호흡하세요."}
];
function cardioSegs(c){
  const min=c.min||10;
  if(c.kind!=="int") return [{sec:min*60,t:c.t,d:c.d,say:`${c.t} ${min}분이에요. ${c.say||""}`}];
  const segs=[]; let left=min*60;
  while(left>0){
    const r=Math.min(60,left); segs.push({sec:r,t:"달리기",d:"시속 8~9km",say:"달리기! 시속 8에서 9로 올리세요."}); left-=r;
    if(left<=0) break;
    const w=Math.min(120,left); segs.push({sec:w,t:"걷기",d:"시속 5km",say:"걷기로 내려오세요. 시속 5."}); left-=w;
  }
  return segs;
}
function buildSteps(a){
  const st=[];
  WARM.forEach((s,i)=>st.push({...s,k:"warm",key:"warm"+i}));
  a.exercises.forEach((x,ei)=>x.sets.forEach((_,si)=>{
    st.push({k:"set",ei,si,key:`set-${ei}-${si}`});
    const lastSet=si===x.sets.length-1, lastEx=ei===a.exercises.length-1;
    if(!(lastSet&&lastEx)) st.push({k:"rest",ei,si,key:`rest-${ei}-${si}`,sec:lastSet?Math.max(x.rest,60):x.rest});
  }));
  cardioSegs(a.cardio).forEach((s,i)=>st.push({...s,k:"cardio",key:"cardio"+i}));
  COOL.forEach((s,i)=>st.push({...s,k:"cool",key:"cool"+i}));
  return st;
}
function curStep(a){
  const steps=buildSteps(a); let i=steps.findIndex(s=>s.key===(a.coach&&a.coach.key));
  if(i<0) i=0;
  // a set already ticked off in the list view moves the coach on
  while(steps[i]&&steps[i].k==="set"&&a.exercises[steps[i].ei].sets[steps[i].si].done) i++;
  if(!steps[i]) i=steps.length-1;
  return {steps,i,st:steps[i]};
}
const stepLeft=a=>{const {st}=curStep(a);const c=a.coach;if(!st.sec)return null;const now=c.paused?c.pausedAt:Date.now();return st.sec-(now-c.start)/1000};
function stepTitle(a,st){
  if(!st) return "";
  if(st.k==="set"||st.k==="rest"){const x=a.exercises[st.ei];return EX[x.id].n}
  return st.t;
}

/* voice */
function say(text){
  if(!S.profile.voice||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=1.05;
    const v=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang)); if(v) u.voice=v;
    music.duck(true); u.onend=u.onerror=()=>music.duck(false);
    speechSynthesis.speak(u);
  }catch(e){}
}
function setSpeech(a,st,first){
  const x=a.exercises[st.ei], e=EX[x.id], s=x.sets[st.si], last=st.si===x.sets.length-1;
  const load=e.t==="bw"?"":`${s.kg}킬로, `;
  return `${first?"다음 운동은 ":""}${e.n}, ${st.si+1}세트. ${load}${s.reps}${e.u==="초"?"초":"회"}. ${last?"마지막 세트예요, 힘내세요! ":""}시작!`;
}
function announce(a,steps,i){
  const st=steps[i], prev=steps[i-1];
  if(st.k==="warm") return say((i===0?`좋은 아침이에요! 오늘은 ${a.name}, ${S.profile.sessionMin}분 루틴이에요. ${a.phase?`${a.phase.label.replace(" · "," ")} ${a.phase.inS}주차예요. `:""}${a.phase&&a.phase.deload?"이번 주는 회복 주간이라 가볍게 해요. ":""}워밍업부터 시작할게요. `:"")+st.say);
  if(st.k==="set") return say(setSpeech(a,st,st.si===0));
  if(st.k==="rest") return say(`좋아요! ${st.sec}초 쉬세요.`);
  if(st.k==="cardio") return say((prev&&prev.k!=="cardio"?"근력 운동 끝! 이제 유산소예요. ":"")+st.say);
  if(st.k==="cool") return say((prev&&prev.k!=="cool"?"유산소 끝! 마무리 스트레칭이에요. ":"")+st.say);
}

/* sound effects */
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume()}catch(e){}return actx}
function tone(f,t,dur,type,vol,dest){const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||actx.destination);o.start(t);o.stop(t+dur+.02);return o}
function sfx(kind){
  if(!ensureAudio()) return; const t=actx.currentTime;
  if(kind==="tick") tone(1046,t,.09,"square",.08);
  if(kind==="go"){tone(784,t,.12,"square",.1);tone(1568,t+.12,.35,"square",.12)}
  if(kind==="done"){[523,659,784].forEach((f,k)=>tone(f,t+k*.08,.4,"triangle",.14))}
  if(kind==="finish"){[523,659,784,1046].forEach((f,k)=>tone(f,t+k*.14,.6,"triangle",.15))}
  try{navigator.vibrate&&navigator.vibrate(kind==="go"?[120,60,220]:60)}catch(e){}
}

/* music: an upbeat 128 BPM loop for work, a slow pad for rest — generated live, nothing to download */
const mtof=n=>440*Math.pow(2,(n-69)/12);
let noiseBuf=null;
function noise(t,dur,vol,hp,dest){
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=noiseBuf;f.type="highpass";f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(dest);s.start(t);s.stop(t+dur+.02);
}
function synth(t,n,dur,type,vol,cut,att,dest){
  const o=actx.createOscillator(),f=actx.createBiquadFilter(),g=actx.createGain();
  o.type=type;o.frequency.value=mtof(n);f.type="lowpass";f.frequency.value=cut;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.05);
}
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const music={mode:null,iv:null,gain:null,next:0,i:0,
  set(mode){
    if(!mode||!S.profile.music) return this.stop();
    if(!ensureAudio()) return;
    if(!this.gain){this.gain=actx.createGain();this.gain.gain.value=.45;this.gain.connect(actx.destination)}
    if(this.mode!==mode){this.mode=mode;this.i=0}
    this.next=Math.max(this.next,actx.currentTime+.05);
    if(!this.iv) this.iv=setInterval(()=>this.sched(),25);
  },
  stop(){clearInterval(this.iv);this.iv=null;this.mode=null},
  duck(on){if(this.gain&&actx)this.gain.gain.setTargetAtTime(on?.12:.45,actx.currentTime,.08)},
  sched(){
    const step=60/(this.mode==="work"?128:70)/4;
    while(this.next<actx.currentTime+.15){this.play(this.i,this.next,step);this.next+=step;this.i=(this.i+1)%64}
  },
  play(i,t,step){
    const d=this.gain, pos=i%16, ch=PROG[Math.floor(i/16)%4];
    if(this.mode==="work"){
      if(pos%4===0){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(d);o.start(t);o.stop(t+.2)}
      if(pos%4===2) noise(t,.05,.18,7000,d);
      if(pos===4||pos===12) noise(t,.16,.32,1800,d);
      if(pos%2===0) synth(t,ch[0]-24,step*1.7,"sawtooth",.16,380,.005,d);
      if([0,3,6,8,11,14].includes(pos)) synth(t,ch[[0,1,2,1,2,0][[0,3,6,8,11,14].indexOf(pos)]]+12,step*1.4,"square",.035,2400,.005,d);
    }else{
      if(pos===0) ch.forEach(n=>synth(t,n,step*15,"sine",.07,1400,.6,d));
      if(pos%4===0) synth(t,ch[(i>>2)%3]+12,step*3.5,"triangle",.035,3000,.02,d);
    }
  }
};
const musicFor=k=>k==="rest"||k==="cool"?"rest":"work";

/* stepping */
let coachIv=null;
function coachGo(i,steps){
  const a=S.active; steps=steps||buildSteps(a);
  const st=steps[i];
  if(!st){coachFinish();return}
  a.coach={...a.coach,key:st.key,start:Date.now(),paused:false,cue:{}};
  saveDraft(); music.set(musicFor(st.k)); announce(a,steps,i); render();
}
function coachNext(){
  const a=S.active; if(!a) return;
  const {steps,i,st}=curStep(a);
  if(st.k==="set"){a.exercises[st.ei].sets[st.si].done=true;sfx("done")}
  if(st.k==="cardio"&&!(steps[i+1]&&steps[i+1].k==="cardio")) a.cardioDone=true;
  coachGo(i+1,steps);
}
function coachFinish(){
  const a=S.active, min=Math.round((Date.now()-a.start)/60000);
  music.stop(); sfx("finish"); say(`오늘 운동 끝! ${min}분 동안 정말 수고했어요. 단백질 챙겨 드세요.`);
  finishWorkout();
}
function coachTick(){
  const a=S.active; if(!a||!a.coach||S.view==="list"||S.tab!=="today") return;
  const c=a.coach; if(c.paused) return;
  const {steps,i,st}=curStep(a);
  const tot=$("cTot"); if(tot) tot.style.width=Math.min(100,(Date.now()-a.start)/(S.profile.sessionMin*600))+"%";
  let left=null;
  if(st.sec) left=stepLeft(a);
  else if(st.k==="set"&&c.timer){const e=EX[a.exercises[st.ei].id];left=a.exercises[st.ei].sets[st.si].reps-(Date.now()-c.timer)/1000;if(left<=0){c.timer=null;coachNext();return}}
  if(left==null) return;
  const total=st.sec||a.exercises[st.ei].sets[st.si].reps;
  const clk=$("cClock"); if(clk) clk.textContent=fmtT(Math.ceil(Math.max(0,left)));
  const bar=$("cBar"); if(bar) bar.style.width=Math.max(0,Math.min(100,left/total*100))+"%";
  c.cue=c.cue||{};
  if(st.k==="rest"&&left<=10&&left>9&&!c.cue.ten){c.cue.ten=1;const nx=steps[i+1];say(`10초 남았어요. 다음은 ${nx&&nx.k==="set"?EX[a.exercises[nx.ei].id].n+" "+(nx.si+1)+"세트":stepTitle(a,nx)}.`)}
  if(st.sec>=120&&left<=st.sec/2&&left>st.sec/2-1&&!c.cue.half){c.cue.half=1;say("절반 지났어요. 좋아요, 계속 가요!")}
  for(const n of [3,2,1]) if(left<=n&&left>n-1&&!c.cue["t"+n]){c.cue["t"+n]=1;sfx("tick")}
  if(left<=0){sfx("go");coachNext()}
}
function startCoachTimer(){clearInterval(coachIv);coachIv=setInterval(coachTick,200)}

function viewCoach(){
  const a=S.active, {steps,i,st}=curStep(a), c=a.coach, next=steps[i+1];
  const sm=S.profile.sessionMin, endAt=new Date(a.start+sm*60000), hhmm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const phase={warm:"워밍업",set:"근력 운동",rest:"휴식",cardio:"유산소",cool:"스트레칭"}[st.k];
  const nextTxt=!next?"마지막 단계예요":next.k==="set"?(()=>{const x=a.exercises[next.ei],e=EX[x.id],s=x.sets[next.si];return `${e.n} ${next.si+1}세트 · ${e.t==="bw"?"":s.kg+"kg × "}${s.reps}${e.u||"회"}`})():next.k==="rest"?`휴식 ${next.sec}초`:`${next.t}${next.sec?" · "+fmtT(next.sec):""}`;
  let body="";
  if(st.k==="set"){

function coachClick(b){
  const a=S.active; if(!a) return false; const d=b.dataset;
  if(b.id==="cDone"){coachNext();return true}
  if(b.id==="cSkip"){sfx("tick");coachNext();return true}
  if(b.id==="cTimer"){a.coach.timer=Date.now();say("시작!");sfx("go");saveDraft();render();return true}
  if(b.id==="cPause"){
    const c=a.coach;
    if(c.paused){c.start+=Date.now()-c.pausedAt;if(c.timer)c.timer+=Date.now()-c.pausedAt;c.paused=false;music.set(musicFor(curStep(a).st.k));say("다시 시작할게요.")}
    else{c.paused=true;c.pausedAt=Date.now();music.stop();try{speechSynthesis.cancel()}catch(e){}}
    saveDraft();render();return true}
  if(d.cadj){a.coach.start+=(+d.cadj)*1000;saveDraft();coachTick();return true}
  if(d.ck){
    const {st}=curStep(a); if(st.k!=="set") return true;
    const x=a.exercises[st.ei], e=EX[x.id], s=x.sets[st.si];
    if(d.ck==="kg"){s.kg=Math.max(0,+((+s.kg||0)+(+d.v)*incOf(e.t)).toFixed(2));for(let k=st.si+1;k<x.sets.length;k++)if(!x.sets[k].done)x.sets[k].kg=s.kg}
    else s.reps=Math.max(1,(+s.reps||0)+(+d.v)*(e.u==="초"?5:1));
    saveDraft();render();return true}
  if(d.ctog){S.profile[d.ctog]=!S.profile[d.ctog];store.saveProfile();
    if(d.ctog==="music"){S.profile.music?music.set(musicFor(curStep(a).st.k)):music.stop()}
    if(d.ctog==="voice"&&!S.profile.voice){try{speechSynthesis.cancel()}catch(e){}}
    render();return true}
  if(b.id==="cList"){S.view="list";render();return true}
  if(b.id==="cCoach"){S.view="coach";render();return true}
  return false;
}

/* ---------- analysis: muscles worked, recovery map, calories, calendar ---------- */
// primary / secondary muscles per exercise
const MUS = {
  bench:[["chest"],["tri","sho"]], dbpress:[["chest"],["tri","sho"]], incline:[["chest","sho"],["tri"]], dbfly:[["chest"],["sho"]], pushup:[["chest"],["tri","sho","abs"]],
  latpd:[["lats"],["bi","traps"]], cgpd:[["lats"],["bi"]], uhpd:[["lats","bi"],[]], sapd:[["lats"],["tri"]], dbrow:[["lats"],["bi","traps"]], bbrow:[["lats","traps"],["bi","lowback"]],
  squat:[["quads","glutes"],["ham","lowback"]], goblet:[["quads","glutes"],["abs"]], rdl:[["ham","glutes"],["lowback"]], dbrdl:[["ham","glutes"],["lowback"]],
  lunge:[["quads","glutes"],["ham"]], split:[["quads","glutes"],["ham"]], stepup:[["quads","glutes"],["ham"]], hthrust:[["glutes"],["ham"]],
  ohp:[["sho"],["tri"]], bbohp:[["sho"],["tri","traps"]], lraise:[["sho"],[]], rdraise:[["sho"],["traps"]],
  curl:[["bi"],[]], hammer:[["bi"],[]], pdown:[["tri"],[]], ohtri:[["tri"],[]],
  plank:[["abs"],["sho"]], crunch:[["abs"],[]], legraise:[["abs"],[]], mclimb:[["abs"],["sho","quads"]]
};
const MNAME = {chest:"가슴",sho:"어깨",bi:"이두",tri:"삼두",abs:"복근",lats:"광배",traps:"승모",lowback:"허리",glutes:"엉덩이",quads:"허벅지 앞",ham:"허벅지 뒤",calves:"종아리"};
const PARTS = ["가슴","등","어깨","하체","팔"];
const bodyKg = () => curWeight()||70;
function setVolume(id,s){const e=EX[id];if(!e||!s.done||e.u==="초")return 0;return (+s.kg||0)*(+s.reps||0)*(e.t==="db"&&!e.one?2:1)}

// fatigue 0..1 per muscle: sets in the last 72h, fading linearly as the muscle recovers
function fatigue(now=Date.now()){
  const f={}; Object.keys(MNAME).forEach(m=>f[m]=0);
  for(const w of S.history){
    const h=(now-new Date(w.date).getTime())/36e5; if(h>72||h<0) continue;
    const rec=1-h/72;
    for(const x of w.exercises){
      const mu=MUS[x.id]; if(!mu) continue;
      const n=x.sets.filter(s=>s.done).length;
      mu[0].forEach(m=>f[m]+=n*rec); mu[1].forEach(m=>f[m]+=n*.5*rec);
    }
  }
  Object.keys(f).forEach(m=>f[m]=Math.min(1,f[m]/8));
  return f;
}
function planLoad(items){
  const f={}; Object.keys(MNAME).forEach(m=>f[m]=0);
  items.forEach(it=>{const mu=MUS[it.id];if(!mu)return;mu[0].forEach(m=>f[m]=1);mu[1].forEach(m=>f[m]=Math.max(f[m],.45))});
  return f;
}

let anMetric="kcal";
function weekChart(){
  const days=[]; for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const val=d=>{const ws=S.history.filter(w=>new Date(w.date).toDateString()===d.toDateString());
    return anMetric==="kcal"?ws.reduce((a,w)=>a+workoutKcal(w),0):anMetric==="time"?Math.round(ws.reduce((a,w)=>a+(w.duration||0),0)/60):ws.reduce((a,w)=>a+(w.volume||0),0)};
  const vs=days.map(val), max=Math.max(1,...vs), unit={kcal:"kcal",time:"분",vol:"kg"}[anMetric];
  const W=320,H=150,bw=30,gap=(W-16-bw*7)/6,y=v=>H-24-(v/max)*(H-48);
  const sum=vs.reduce((a,b)=>a+b,0), cnt=vs.filter(Boolean).length;
  const seg=[["vol","볼륨"],["kcal","칼로리"],["time","시간"]].map(([k,l])=>`<button type="button" data-anm="${k}" aria-pressed="${anMetric===k}">${l}</button>`).join("");
  return `<section class="an-card"><div class="an-h"><h3>최근 7일 운동</h3><span class="label">${days[0].getMonth()+1}.${days[0].getDate()} ~ ${days[6].getMonth()+1}.${days[6].getDate()}</span></div>
    <div class="seg" role="group">${seg}</div>
    <div class="an-sum"><span class="num">${sum.toLocaleString()}<small>${unit}</small></span><span class="note">${cnt}일 운동${cnt?` · 하루 평균 ${Math.round(sum/cnt).toLocaleString()}${unit}`:""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 ${unit}">
      <line x1="8" x2="${W-8}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
      ${days.map((d,i)=>{const x=8+i*(bw+gap),yy=y(vs[i]);return `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,H-24-yy)}" rx="5" fill="${i===6?"var(--accent)":"var(--accent-soft)"}"/>
        ${vs[i]?`<text x="${x+bw/2}" y="${yy-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)" font-family="Barlow Condensed,sans-serif">${vs[i].toLocaleString()}</text>`:""}
        <text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Gothic A1,sans-serif">${i===6?"오늘":WD[d.getDay()]}</text>`}).join("")}
    </svg>${sum?"":`<p class="note" style="text-align:center">최근 7일 기록이 없어요. 코치 모드로 첫 운동을 해 보세요.</p>`}</section>`;
}

const goalOf = () => GOALS[S.profile.goal]?S.profile.goal:"lose";
// the program week counts only weeks you actually trained, so a missed week never skips you ahead
function progInfo(){
  const p=S.profile, g=goalOf();

  const trained=new Set();
  for(const w of S.history){const d=new Date(w.date);if(d>=start&&d<cur)trained.add(weekStart(d).getTime())}

  else{const b=Math.floor(inS/4);st=CYCLE[b%CYCLE.length];cycleNo=Math.floor(b/CYCLE.length)+1;inS%=4;len=4;deload=inS===3;label=`4단계 · ${st.n}`}

}

/* ---------- loads: start weights, double progression, deloads ---------- */
const e1rm = (kg,r) => kg*(1+r/30); // Epley
function roundKg(kg,t,floor){const inc=incOf(t)||1, min=t==="bb"?20:t==="cb"?5:1;return Math.max(min,+((floor?Math.floor:Math.round)(kg/inc+1e-9)*inc).toFixed(2))}
function startKg(e,lv){if(e.t==="bw")return 0;let kg=e.s[lv];if(S.profile.diet.sex==="f")kg*=e.m==="하체"?.7:.55;return roundKg(kg,e.t)}
function nextLoad(id,e,lo,hi,lv){
  if(e.u==="초") return {kg:0,reps:lo,why:""};
  const lp=lastPerf(id,null,true), done=lp?lp.sets.filter(s=>s.done):[];
  if(!done.length) return {kg:startKg(e,lv),reps:lo,why:e.t==="bw"?"처음":"시작 무게"};
  const top=Math.max(...done.map(s=>+s.kg||0)), minR=Math.min(...done.map(s=>+s.reps||0)), all=done.length>=lp.sets.length;
  const pLo=lp.lo||lp.target, pHi=lp.hi||lp.target;
  if(e.t==="bw"){const up=all&&minR>=pHi;return {kg:0,reps:Math.min(hi+5,Math.max(lo,up?minR+1:minR)),why:up?"지난번 성공 · +1회":"지난번 기록 기준"}}
  if(hi<pLo-1||lo>pHi+1){ // the new stage uses a different rep range: carry strength over through the estimated 1RM
    const best=Math.max(...done.map(s=>e1rm(+s.kg||0,+s.reps||0)));
    return {kg:roundKg(best/(1+(lo+2)/30),e.t,true),reps:lo,why:"새 단계 · 무게 다시 맞춤"}}
  if(all&&minR>=pHi) return {kg:roundKg(top+incOf(e.t),e.t),reps:lo,why:`목표 달성 · +${incOf(e.t)}kg`};
  if(minR>=pLo){const r=Math.max(lo,Math.min(hi,minR+1));return {kg:top,reps:r,why:`같은 무게로 ${r}회 도전`}}
  // missed the bottom of the range twice in a row at this weight: back off 10% and build up again
  let miss=0;
  for(const w of S.history){if(w.deload)continue;const x=w.exercises.find(x=>x.id===id);if(!x)continue;const ds=x.sets.filter(s=>s.done);if(!ds.length)continue;
    if(Math.max(...ds.map(s=>+s.kg||0))===top&&Math.min(...ds.map(s=>+s.reps||0))<(x.lo||x.target)){if(++miss>=2)break}else break}
  if(miss>=2) return {kg:roundKg(top*.9,e.t),reps:lo,why:"정체 · 10% 낮춰 다시"};
  return {kg:top,reps:lo,why:"지난번 무게 다시"};
}
const bmiNow = () => {const h=(S.profile.diet.height||171)/100;return bodyKg()/(h*h)};

/* ---------- calories: MET values, treadmill from the ACSM walking/running equations ---------- */
function cardioMet(c){
  const v=(kmh,gr,run)=>{const m=kmh*1000/60;return (run?3.5+.2*m+.9*m*gr:3.5+.1*m+1.8*m*gr)/3.5};
  return c&&c.kind==="int"?(v(8.5,0,1)+2*v(5,0))/3:v((c&&c.spd)||5,((c&&c.gr)||10)/100);
}
const exMet = e => e.c?6:e.m==="코어"?3.8:3.5;
// MET-minutes of the coach's warm-up (4 min walk at 5.5km/h, 3% + 1 min body-weight) and cool-down (2 min stretching)
const WARM_MM = 4*cardioMet({spd:5.5,gr:3})+3.5, COOL_MM = 2*2.5;
// each set: about 45 s of work, then the rest standing (2 MET)
const setsMM = list => list.reduce((a,[e,n,rest])=>a+n*(.75*exMet(e)+rest/60*2),0);
function planKcal(p){return Math.round((WARM_MM+setsMM(p.items.map(it=>[EX[it.id],it.sets,it.rest]))+p.cardioMin*cardioMet(p.cardio)+COOL_MM)*bodyKg()/60)}
function workoutKcal(w){if(w.kcal)return w.kcal;return Math.round(bodyKg()*5*(w.duration||0)/3600)}
function bestE1(id,skipId){let b=0;for(const w of S.history){if(w.id===skipId)continue;for(const x of w.exercises)if(x.id===id)for(const s of x.sets)if(s.done)b=Math.max(b,e1rm(+s.kg||0,+s.reps||0))}return b}

/* ---------- weight: BMI (Korean cut-offs), 7-day average, 3-week trend ---------- */
function bmiCat(b){return b<18.5?["저체중","var(--accent)"]:b<23?["정상","var(--ok)"]:b<25?["비만 전단계","var(--yellow)"]:b<30?["1단계 비만","var(--red)"]:b<35?["2단계 비만","var(--red)"]:["3단계 비만","var(--red)"]}
const dT = k => new Date(k+"T12:00:00").getTime();
function weightTrend(ws){
  if(!ws.length) return null;
  const end=dT(ws[ws.length-1].d), pts=ws.filter(w=>end-dT(w.d)<=21*864e5).map(w=>[(dT(w.d)-end)/864e5,w.kg]);
  if(pts.length<4||-pts[0][0]<7) return null;
  const n=pts.length, mx=pts.reduce((a,p)=>a+p[0],0)/n, my=pts.reduce((a,p)=>a+p[1],0)/n;
  return pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/pts.reduce((a,p)=>a+(p[0]-mx)**2,0)*7;

function obFinish(){
  try{obSave()}catch(e){
    // never leave the person stuck on the last step: close the form even if something below failed
    S.ob=null; S.profile.onboarded=1; ls.set("pt.profile",S.profile);
    try{render()}catch(_){$("view").innerHTML=`<p class="note">화면을 그리지 못했어요. 새로고침해 주세요. (${esc(String(e&&e.message||e))})</p>`}
    toast("저장 중 문제가 있었어요: "+(e&&e.message||e));
  }
}
function obSave(){
  const d=S.ob.d, p=S.profile;
  S.weights=cleanWeights(S.weights);
  p.diet={...p.diet,sex:d.sex,age:Math.round(d.age),height:d.height,kg0:d.kg,act:d.act};
  p.goal=d.goal; p.goalKg=d.goalKg||suggestGoal(d); p.exp=d.exp; p.level=[0,0,1,2][d.exp];
  p.days=d.days; p.sessionMin=d.sessionMin; p.startTime=d.startTime;
  if(!p.progStart||!p.onboarded) p.progStart=today();
  p.onboarded=1;
  const k=today(), i=S.weights.findIndex(w=>w.d===k), entry={d:k,kg:Math.round(d.kg*10)/10};
  if(d.waist>40&&d.waist<200) entry.waist=Math.round(d.waist*10)/10;
  if(i>=0) S.weights[i]={...S.weights[i],...entry}; else S.weights.push(entry);
  S.weights.sort((a,b)=>a.d.localeCompare(b.d));
  S.ob=null; S.day=null; S.tab="today"; store.saveWeights(); render(); scrollTo(0,0);
  toast("플랜을 만들었어요. 오늘부터 시작해요!");
}
const OB_FIELDS = {obAge:"age",obH:"height",obKg:"kg",obWaist:"waist",obGoalKg:"goalKg"};
// read a number field into the answers; phone keyboards may type full-width digits or a comma
function obRead(el){
  const k=OB_FIELDS[el.id]; if(!k||!S.ob) return;
  const raw=(el.value||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(",",".").replace(/[^\d.]/g,"");
  const v=parseFloat(raw), old=S.ob.d[k];
  S.ob.d[k]=isNaN(v)?null:v; if(k==="goalKg"&&S.ob.d[k]!==old) S.ob.d.goalKgSet=true;
}
document.addEventListener("input",e=>{
  if(!OB_FIELDS[e.target.id]||!S.ob) return;
  obRead(e.target);
  const bx=$("obBmi"); if(bx) bx.innerHTML=bmiBox(S.ob.d);
  const nb=$("obNext"); if(nb) nb.setAttribute("aria-disabled",String(!obValid(S.ob.i,S.ob.d)));
  e.target.closest(".unitin")?.classList.remove("miss"); const er=$("obErr"); if(er) er.textContent="";
});
document.addEventListener("change",e=>{if(e.target.id==="obTime"&&S.ob&&/^\d\d:\d\d$/.test(e.target.value))S.ob.d.startTime=e.target.value});
function obClick(b){
  if(!S.ob) return false; const d=b.dataset, o=S.ob;
  if(d.ob){
    const k=d.ob; o.d[k]=["exp","days","sessionMin","act"].includes(k)?+d.v:d.v;
    if(k==="days") o.d.daysSet=true;
    if((k==="goal"||k==="exp")&&!o.d.daysSet) o.d.days=recDays(o.d);
    if(k==="goal"&&!o.d.goalKgSet) o.d.goalKg=suggestGoal(o.d);
    render(); return true}
  if(b.id==="obNext"||d.obnext){
    document.querySelectorAll("[data-obf]").forEach(obRead);
    const tm=$("obTime"); if(tm&&/^\d\d:\d\d$/.test(tm.value)) o.d.startTime=tm.value;
    const miss=obMissing(o.i,o.d);
    if(miss){
      const er=$("obErr"); if(er) er.textContent=miss[0];
      const inp=$(miss[1]), box=inp?inp.closest(".unitin"):document.querySelector(`[data-ob="${miss[1]}"]`)?.parentElement;
      if(box){box.classList.add("miss");box.scrollIntoView({block:"center",behavior:"smooth"})}
      if(inp) inp.focus();
      try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
      return true}
    if(o.i===OB_STEPS-1) obFinish(); else {o.i++;render();scrollTo(0,0)}
    return true}
  if(b.id==="obBack"){if(o.i>0)o.i--;else if(o.force)S.ob=null;render();scrollTo(0,0);return true}
  return false;
}

/* ---------- analysis: progress per exercise, streak, recent workouts ---------- */
function weekStreak(){
  const goal=S.profile.days, cnt=k=>{const s=weekStart();s.setDate(s.getDate()-7*k);const e=new Date(s);e.setDate(e.getDate()+7);return S.history.filter(w=>{const d=new Date(w.date);return d>=s&&d<e}).length};
  let n=cnt(0)>=goal?1:0; for(let k=1;k<260&&cnt(k)>=goal;k++)n++;
  return n;
}
let anEx=null;
function exProgressCard(){
  const cnt={}; for(const w of S.history)for(const x of w.exercises)if(EX[x.id]&&x.sets.some(s=>s.done))cnt[x.id]=(cnt[x.id]||0)+1;
  const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||(EX[b].c?1:0)-(EX[a].c?1:0));
  const head=`<div class="an-h"><h3>종목별 성장</h3><span class="label">최근 12회</span></div>`;

  if(!anEx||!cnt[anEx]) anEx=ids[0];
  const e=EX[anEx], kind=e.u==="초"?"sec":e.t==="bw"?"reps":"kg", unit={sec:"초",reps:"회",kg:"kg"}[kind];
  const ses=S.history.filter(w=>w.exercises.some(x=>x.id===anEx&&x.sets.some(s=>s.done))).slice(0,12).reverse().map(w=>{
    const ds=w.exercises.find(x=>x.id===anEx).sets.filter(s=>s.done);
    const top=ds.reduce((b,s)=>e1rm(+s.kg||0,+s.reps||0)>e1rm(+b.kg||0,+b.reps||0)?s:b,ds[0]);
    return {d:new Date(w.date),v:kind==="kg"?Math.round(e1rm(+top.kg||0,+top.reps||0)*10)/10:Math.max(...ds.map(s=>+s.reps||0)),top,dl:!!w.deload}});
  const vs=ses.map(s=>s.v), lo=Math.min(...vs), hi=Math.max(...vs), span=Math.max(1,hi-lo), last=ses[ses.length-1], first=ses[0];
  const W=320,H=120, x=i=>ses.length>1?14+i*(W-28)/(ses.length-1):W/2, y=v=>14+(hi-v)/span*(H-40);
  const ch=Math.round((last.v-first.v)*10)/10;
  const bestSet=kind==="kg"?ses.reduce((b,s)=>(+s.top.kg>+b.top.kg||(+s.top.kg===+b.top.kg&&+s.top.reps>+b.top.reps))?s:b,ses[0]).top:null;

    ${ses.length>1?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(e.n)} 기록 변화">
      <path d="${ses.map((s,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(s.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ses.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.v)}" r="${i===ses.length-1?4.5:3}" fill="${s.dl?"var(--surface)":"var(--accent)"}" stroke="var(--accent)" stroke-width="1.5"/>`).join("")}
      <text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${first.d.getMonth()+1}/${first.d.getDate()}</text>
      <text x="${x(ses.length-1)}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${last.d.getMonth()+1}/${last.d.getDate()}</text>
    </svg>`:""}
    <p class="note">${kind==="kg"?`최고 세트 <b style="color:var(--fg)">${bestSet.kg}kg × ${bestSet.reps}회</b> · 지난번 <b style="color:var(--fg)">${last.top.kg}kg × ${last.top.reps}회</b>. 빈 점은 회복 주간이에요.`:`지난번 ${last.v}${unit}. 목표 횟수를 넘기면 다음번에 1회씩 늘어요.`}</p></section>`;
}

  hammer:{c:["손바닥이 서로 마주 보게 덤벨을 잡습니다","팔꿈치를 옆구리에 고정하고 들어 올립니다","내릴 때 팔을 거의 다 폅니다"],w:"몸을 흔들어 반동으로 드는 것"},

/* ---------- detail sheet: photo stage + in-app YouTube ---------- */
function ytId(u){
  u=(u||"").trim(); if(/^[\w-]{11}$/.test(u)) return u;
  const m=u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function saveVideo(id){
  const v=ytId($("vidIn").value);
  if(!v){toast("유튜브 영상 주소를 붙여넣어 주세요");return}
  S.profile.videos[id]=v; store.saveProfile(); openInfo(id); toast("이 운동의 자세 영상으로 저장했어요");
}
let stageIv=null, stageFrame=0, stagePaused=false;
function stageShow(f){
  const b=document.querySelector("#stage img.b"), ph=$("phase"); if(!b) return;
  b.style.opacity=f?1:0; if(ph) ph.textContent=f?"② 끝 자세":"① 시작 자세";
}
function openInfo(id){
  const e=EX[id], q=CUE[id]||{c:[],w:""}, vid=S.profile.videos[id];
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" 자세");
  $("scrim").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.n)} 자세">
    <div class="grab"></div>
    <button type="button" class="stage" id="stage" aria-label="자세 사진 · 눌러서 멈추기"><img src="img/${id}-0.jpg" alt="${esc(e.n)} 시작 자세"><img class="b" src="img/${id}-1.jpg" alt="${esc(e.n)} 끝 자세" style="opacity:0"><span class="phase" id="phase">① 시작 자세</span><span class="hint">눌러서 멈춤</span></button>
    <div><div class="label">${e.m} · ${({bb:"바벨",db:"덤벨",mc:"머신",cb:"케이블",bw:"맨몸"})[e.t]}</div><h2>${esc(e.n)}</h2></div>
    <ol class="cues">${q.c.map((x,i)=>`<li><b>${i+1}</b><span>${esc(x)}</span></li>`).join("")}</ol>
    ${q.w?`<div class="warn"><b>흔한 실수</b> · ${esc(q.w)}</div>`:""}
    <div class="video">
      <div class="label">자세 영상</div>
      ${vid?`<a class="player" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener" aria-label="저장한 자세 영상 재생"><span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>내 자세 영상 재생</span></a>
        <div class="sheet-row"><button type="button" class="btn-ghost" id="vidDel" data-ex="${id}" style="padding:10px">다른 영상으로 바꾸기</button></div>`
      :`<a class="yt" href="${yt}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>유튜브에서 자세 영상 찾기</a>
        <p class="note">마음에 드는 영상의 '공유 → 링크 복사' 후 아래에 붙여넣으면, 다음부터 한 번에 그 영상이 열려요.</p>
        <div class="paste"><input id="vidIn" data-ex="${id}" inputmode="url" placeholder="https://youtu.be/…" aria-label="유튜브 영상 주소"><button type="button" id="vidSave" data-ex="${id}">저장</button></div>`}
    </div>
    <div class="sheet-row"><button type="button" class="btn-ghost" id="closeInfo" style="padding:12px">닫기</button></div>
  </div>`;
  $("scrim").hidden=false; document.body.style.overflow="hidden";
  stageFrame=0; stagePaused=false; clearInterval(stageIv);
  stageIv=setInterval(()=>{if(stagePaused)return;stageFrame=1-stageFrame;stageShow(stageFrame)},1400);
}
function closeInfo(){clearInterval(stageIv);$("scrim").hidden=true;$("scrim").innerHTML="";document.body.style.overflow=""}
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeInfo()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeInfo()});
// the stage button toggles pause; reflect it in the hint
document.addEventListener("click",e=>{if(e.target.closest("#stage")){const h=document.querySelector("#stage .hint");if(h)h.textContent=stagePaused?"눌러서 재생":"눌러서 멈춤"}});

/* ---------- boot ---------- */
loadLocal();
applyTheme();
S.active=ls.get("pt.active",null);
render();
if(S.active){tickElapsed();wake();if(S.active.coach)startCoachTimer()}
// browsers start audio only after a tap: resume the music on the first touch after reopening
document.addEventListener("pointerdown",()=>{if(S.active&&S.active.coach&&!S.active.coach.paused&&S.tab==="today"&&!music.iv)music.set(musicFor(curStep(S.active).st.k))},{capture:true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
initCloud();
</script>

<script>
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
